name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build Tailwind CSS
        run: npx @tailwindcss/cli -i input.css -o static/site.css --minify

      - name: Generate spec page
        run: |
          {
            printf '+++\ntitle = "Specification"\ndescription = "The Cassis Order Protocol v1.0 draft: connection URIs, transport, sessions and the invoice messages."\ntemplate = "spec.html"\n+++\n\n'
            tail -n +2 spec.md
          } > content/spec.md

      - name: Install Zola
        run: |
          curl -fsSL https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar -xz -C /usr/local/bin

      - name: Build site
        run: zola build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
